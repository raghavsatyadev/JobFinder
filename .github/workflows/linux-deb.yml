name: Linux .deb

# Manual or on a release tag. GitHub Actions billing on this account is blocked, so this runs
# locally with act: `act workflow_dispatch -W .github/workflows/linux-deb.yml
# --artifact-server-path <dir>` (Docker must be running).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # composeApp has an Android target, so Gradle needs an SDK even for the desktop app.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Browser extension dependencies
        run: npm ci
        working-directory: browser-extension

      # act copies the files from Windows, which has no executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the .deb
        run: ./gradlew :desktopCMP:packageDeb --console=plain

      - name: Upload the .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jobfinder-deb
          path: desktopCMP/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
