# Version lookup date: 2026-10-15.
# Rule: every entry is the newest published version (alpha/beta/rc/stable) on Maven Central, Google
# Maven or the Gradle Plugin Portal on that date. Any step back is a "PIN" comment next to the entry
# with the reason (Kotlin <-> KSP <-> CMP <-> AGP <-> Room <-> Gradle compatibility). No pins yet.
# Gradle wrapper: 9.9.0-milestone-2 (newest non-snapshot on services.gradle.org/versions/all).

[versions]

# App identity
releaseAppName = "JobFinder"
nameSpace = "io.github.raghavsatyadev.jobfinder"
appIdProd = "io.github.raghavsatyadev.jobfinder"
sharedAndroidId = "io.github.raghavsatyadev.jobfinder.compose"
sharedModuleAndroidId = "io.github.raghavsatyadev.jobfinder.shared"

# SDK versions (SDK 37 needs the 37.1 platform for Compose 1.13 alphas, hence compileSdkMinor)
targetSdk = "37"
minSdk = "26"
compileSdk = "37"
compileSdkMinor = "1"
buildTools = "36.1.0"

# App version
versionCode = "51"
versionName = "0.0.51"

# Plugin versions
agp = "9.6.0-alpha01"
kotlin = "2.5.0-Beta1"
ksp = "2.3.12"
room3 = "3.1.0-alpha01"
screenshot = "0.0.1-alpha16"
foojay = "1.0.0"

# Compose / AndroidX
activity = "1.14.0-alpha03"
compose-ui = "1.13.0-beta01"
compose-multiplatform = "1.13.0-alpha02"
compose-material3-mp = "1.13.0-alpha02"
compose-icons-extended-mp = "1.7.3"
lifecycle-mp = "2.11.0"
navigation3-mp = "1.2.0-rc01"
adaptive-mp = "1.3.0"
collections-immutable = "0.5.2"
sqlite = "2.8.0-alpha01"
androidx-test-ext = "1.3.0"

# Kotlin libraries
coroutines = "1.11.0"
atomicfu = "0.33.0"
serialization = "1.12.0-RC"

# DI
koin = "4.2.2"

# Networking
ktor = "3.6.0"

# Other libraries
coil = "3.6.3"
cryptography = "0.6.0"
cron-utils = "9.2.1"
flexmark = "0.64.8"
jcefmaven = "152.0.6"
# Must match the jcef-api version that jcefmaven 152.0.6 depends on (see its POM), or jcefmaven
# ignores the bundled natives and downloads them on first run.
jcef-natives = "jcef-17e805a+cef-152.0.6+g708dc14+chromium-152.0.7977.83"
jna = "5.19.1"
jmdns = "3.6.4"
jsoup = "1.23.2"
pdfbox = "3.0.8"
junit = "4.13.2"
logback = "1.6.5"
markdown-renderer = "0.46.0"
reorderable = "3.1.0"
play-services-code-scanner = "16.1.0"
postgresql = "42.7.14"
qrose = "1.3.1"
multiplatform-settings = "1.3.0"

[libraries]
# Kotlin / coroutines / serialization
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }

# Compose Multiplatform
compose-ui-mp = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation-mp = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3-mp = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3-mp" }
compose-components-resources-mp = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview-mp = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-runtime-mp = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-icons-extended-mp = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons-extended-mp" }

# Lifecycle / Navigation 3 (multiplatform)
lifecycle-viewmodel-compose-mp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-mp" }
lifecycle-runtime-compose-mp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-mp" }
lifecycle-viewmodel-navigation3-mp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-mp" }
navigation3-ui-mp = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3-mp" }
adaptive-mp = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "adaptive-mp" }
adaptive-navigation3-mp = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "adaptive-mp" }
material3-adaptive-navigation-suite-mp = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3-mp" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections-immutable" }

# Android
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-ui" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-ui" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose-mp = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel-mp = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Room 3 + bundled SQLite
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }

# Images, markdown, QR
coil-compose-mp = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor-mp = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
# Small per-device key-value store (the job list's sort and filters)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }

# JVM / server side
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
flexmark-html2md = { module = "com.vladsch.flexmark:flexmark-html2md-converter", version.ref = "flexmark" }
cron-utils = { module = "com.cronutils:cron-utils", version.ref = "cron-utils" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
jcef-natives-windows-amd64 = { module = "me.friwi:jcef-natives-windows-amd64", version.ref = "jcef-natives" }
jcef-natives-linux-amd64 = { module = "me.friwi:jcef-natives-linux-amd64", version.ref = "jcef-natives" }
jcef-natives-macosx-arm64 = { module = "me.friwi:jcef-natives-macosx-arm64", version.ref = "jcef-natives" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Backup encryption (AES-GCM, PBKDF2) on the JVM and Android
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }

[bundles]
compose-mp = [
    "compose-ui-mp",
    "compose-ui-tooling-preview-mp",
    "compose-foundation-mp",
    "compose-material3-mp",
    "compose-components-resources-mp",
    "compose-runtime-mp",
    "compose-icons-extended-mp",
]
koin-mp = [
    "koin-core",
    "koin-compose-mp",
    "koin-compose-viewmodel-mp",
]
lifecycle-mp = [
    "lifecycle-viewmodel-compose-mp",
    "lifecycle-runtime-compose-mp",
    "lifecycle-viewmodel-navigation3-mp",
]
navigation-mp = [
    "navigation3-ui-mp",
    "adaptive-mp",
    "adaptive-navigation3-mp",
    "material3-adaptive-navigation-suite-mp",
]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-sse",
    "ktor-server-auth",
    "ktor-server-status-pages",
    "ktor-server-call-logging",
    "ktor-server-content-negotiation",
    "ktor-serialization-kotlinx-json",
]
