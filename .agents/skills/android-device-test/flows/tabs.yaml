# Visit every tab and check one landmark on each. Needs a paired app (androidCMP/maestro/pair.yaml);
# run every flow with androidCMP/maestro/run.sh.
appId: io.github.raghavsatyadev.jobfinder
name: Tabs
---
- launchApp:
    stopApp: false
- assertVisible: "Search jobs"
- tapOn: "Applied.*"
# The tab row scrolls to the open tab, which can push New past the left edge.
- swipe:
    from: "Applied.*"
    direction: RIGHT
- tapOn: "New.*"
- tapOn: "Searches"
- assertVisible: "Job searches"
- tapOn: "AI filters"
- assertVisible: "What to filter out"
- tapOn: "Settings"
# Settings opens with its sections folded; Help is the button in its top bar.
- assertVisible: "Scanning"
- tapOn: "Help"
- assertVisible: "Questions and answers"
- back
- tapOn: "Jobs"
- assertVisible: "Search jobs"
