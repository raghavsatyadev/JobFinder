android.builtInKotlin=true
android.dependency.useConstraints=true
android.enableAppCompileTimeRClass=true
android.enableJetifier=false
android.excludeLibraryComponentsFromConstraints=true
android.lifecycleProcessor.incremental=true
android.newDsl=true
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.onlyEnableUnitTestForTheTestedBuildType=false
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.uniquePackageNames=true
android.useAndroidX=true
android.experimental.enableScreenshotTest=true
kotlin.code.style=official
kotlin.incremental.native=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4096M -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx3072M" -XX\:+UseParallelGC
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

org.gradle.caching=true
